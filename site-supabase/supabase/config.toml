project_id = "site-promo-brindes"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false
port = 56329

[studio]
enabled = true
port = 56323

[local_smtp]
enabled = true
port = 56324

[analytics]
enabled = true
port = 56327
backend = "postgres"

[auth]
site_url = "https://promo-brindes-v1.vercel.app"
# Entradas legadas já existentes no projeto remoto são preservadas para que um
# config push do site nunca interrompa callbacks de integrações ainda ativas.
additional_redirect_urls = [
  "https://promo-brindes-v1.vercel.app/auth/confirm",
  "https://promo-brindes-v1.vercel.app/definir-senha",
  "https://promo-brindes-v1-juca1.vercel.app/",
  "https://promo-brindes-v1-juca1.vercel.app/**",
  "https://promo-*-brindes-v1-juca1.vercel.app",
  "https://promo-*-brindes-v1-juca1.vercel.app/**",
  "https://visao-v2-juca1.vercel.app/",
  "https://visao-v2-juca1.vercel.app/**",
  "https://visao-*-v2-juca1.vercel.app",
  "https://visao-*-v2-juca1.vercel.app/**",
]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 3600
otp_length = 8
