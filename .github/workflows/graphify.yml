name: Graphify structural map

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'site-supabase/supabase/migrations/**'
      - 'site-supabase/supabase/tests/**'
      - '.graphify*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graphify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'site-supabase/supabase/migrations/**'
      - 'site-supabase/supabase/tests/**'
      - '.graphify*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/graphify.yml'

permissions:
  contents: read

jobs:
  build-structural-map:
    name: Build structural Graphify map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Graphify CLI
        run: python -m pip install 'graphifyy==0.9.48'
      - name: Install application dependencies
        run: npm ci
      - name: Validate Graphify guards
        run: |
          npm run graph:doctor
          npm run test:graphify
      - name: Build and validate structural map
        run: |
          npm run graph:build
          npm run graph:check
      - name: Upload safe local map
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: graphify-structural-map-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14
