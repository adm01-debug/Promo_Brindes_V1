name: Graphify structural map

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: graphify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-structural-map:
    name: Build structural Graphify map
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-graphify.txt
      - name: Install locked Graphify CLI
        run: |
          python -m pip install -r requirements-graphify.txt
          python -c 'import tree_sitter_sql'
      - name: Install application dependencies
        run: |
          npm install --global npm@11.17.0
          npm ci
      - name: Validate Graphify guards
        run: |
          npm run graph:doctor
          npm run test:graphify
      - name: Build and validate structural map
        run: |
          npm run graph:build
          npm run graph:check
          npm run graph:benchmark
      - name: Compare pull request base and head maps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_WORKTREE: ${{ runner.temp }}/promo-brindes-base
        run: |
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          (cd "$BASE_WORKTREE" && npm ci --ignore-scripts --prefer-offline)
          (cd "$BASE_WORKTREE" && npm run graph:build)
          npm run graph:compare -- --base "$BASE_WORKTREE/graphify-out/graph.json" --head graphify-out/graph.json --output graphify-out/BASE_HEAD_REPORT.md
          if [[ -f "$BASE_WORKTREE/graphify-out/database/graph.json" && -f graphify-out/database/graph.json ]]; then
            npm run graph:compare -- --base "$BASE_WORKTREE/graphify-out/database/graph.json" --head graphify-out/database/graph.json --output graphify-out/BASE_HEAD_DATABASE_REPORT.md
          else
            printf '%s\n' '# Comparação do grafo de banco' '' 'O snapshot base ainda não possui o corpus SQL separado; a comparação será obrigatória a partir da próxima revisão.' > graphify-out/BASE_HEAD_DATABASE_REPORT.md
          fi
      - name: Upload safe local map
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-structural-map-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: warn
          retention-days: 14
