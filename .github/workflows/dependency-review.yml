name: Dependency review

on:
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Em repositórios privados, a API da ação exige GitHub Advanced Security.
    # O gate principal sempre executa npm audit; esta revisão complementar roda
    # automaticamente quando o repositório público é compatível com a API.
    if: github.event.repository.visibility == 'public'
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Block high-risk dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
