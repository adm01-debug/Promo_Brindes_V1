name: Canonical catalog public contract

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

concurrency:
  group: canonical-catalog-contract
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  contract:
    name: Check read-only product contract
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Load the approved production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN ausente'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::VERCEL_PROJECT_ID ausente'; exit 1; }
          test -n "$VERCEL_SCOPE" || { echo '::error::VERCEL_SCOPE ausente'; exit 1; }
          npm install --global vercel@59.5.0
          vercel pull --yes --environment=production \
            --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" \
            > /dev/null

      - name: Verify the live read-only contract
        id: contract
        continue-on-error: true
        run: |
          set -euo pipefail
          node --env-file=.vercel/.env.production.local scripts/check-catalog-public-contract.mjs \
            > catalog-contract.log 2>&1

      - name: Summarize the contract check
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Contrato público do catálogo canônico'
            echo ''
            echo '- modo: somente leitura'
            echo '- recurso: v_site_products_public'
            echo '- resultado: ${{ steps.contract.outcome }}'
            echo ''
            echo '```text'
            if [ -f catalog-contract.log ]; then cat catalog-contract.log; else echo 'Sonda não executada.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the downloaded environment
        if: always()
        run: node -e "require('node:fs').rmSync('.vercel', { recursive:true, force:true })"

      - name: Enforce the contract result
        if: steps.contract.outcome != 'success'
        run: |
          echo '::error::O contrato público vivo do catálogo divergiu ou ficou indisponível.'
          exit 1
