name: CodeQL security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  # O CodeQL consulta o workflow atual ao finalizar o upload do SARIF.
  # Sem esta leitura, a análise termina mas o resultado não é publicado.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Repositórios privados exigem Code Scanning/Advanced Security habilitado
    # pela conta. Enquanto o recurso não existir, o GitHub rejeita o SARIF
    # após uma análise bem-sucedida. Ao habilitá-lo, defina a variável de
    # repositório CODE_SCANNING_ENABLED=true; repositórios públicos rodam
    # automaticamente.
    if: github.event.repository.visibility == 'public' || vars.CODE_SCANNING_ENABLED == 'true'
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          paths-ignore: |
            docs
            '**/*.md'
            graphify-out
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
