name: CodeQL security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # O CodeQL consulta o workflow atual ao finalizar o upload do SARIF.
  # Sem esta leitura, a análise termina mas o resultado não é publicado.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Repositórios privados exigem Code Scanning/Advanced Security habilitado
    # pela conta. Enquanto o recurso não existir, o GitHub rejeita o SARIF
    # após uma análise bem-sucedida. Ao habilitá-lo, defina a variável de
    # repositório CODE_SCANNING_ENABLED=true; repositórios públicos rodam
    # automaticamente.
    if: github.event.repository.visibility == 'public' || vars.CODE_SCANNING_ENABLED == 'true'
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
