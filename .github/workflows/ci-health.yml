name: CI health report

on:
  schedule:
    # Diário às 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    name: Summarize recent CI runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch recent workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUNS="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50&branch=main" \
            | jq '[.workflow_runs[] | {name: .name, status: .status, conclusion: .conclusion, created_at: .created_at}]')"
          echo "$RUNS" > /tmp/runs.json

      - name: Calculate CI health metrics
        id: runs
        run: |
          set -euo pipefail
          METRICS="$(node scripts/ci-health-metrics.mjs /tmp/runs.json)"
          {
            echo "total=$(jq -r '.total' <<<"$METRICS")"
            echo "successful=$(jq -r '.successful' <<<"$METRICS")"
            echo "failed=$(jq -r '.failed' <<<"$METRICS")"
            echo "inconclusive=$(jq -r '.inconclusive' <<<"$METRICS")"
            echo "terminal=$(jq -r '.terminal' <<<"$METRICS")"
            echo "success_rate=$(jq -r '.successRate // "n/a"' <<<"$METRICS")"
            echo "failure_rate=$(jq -r '.failureRate // "n/a"' <<<"$METRICS")"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          set -euo pipefail
          TOTAL="${{ steps.runs.outputs.total }}"
          SUCCESSFUL="${{ steps.runs.outputs.successful }}"
          FAILED="${{ steps.runs.outputs.failed }}"
          INCONCLUSIVE="${{ steps.runs.outputs.inconclusive }}"
          TERMINAL="${{ steps.runs.outputs.terminal }}"
          SUCCESS_RATE="${{ steps.runs.outputs.success_rate }}"
          FAILURE_RATE="${{ steps.runs.outputs.failure_rate }}"
          [ "$SUCCESS_RATE" = 'n/a' ] || SUCCESS_RATE="${SUCCESS_RATE}%"
          [ "$FAILURE_RATE" = 'n/a' ] || FAILURE_RATE="${FAILURE_RATE}%"
          {
            echo "## CI Health Report — $(date -u '+%Y-%m-%dT%H:%MZ')"
            echo ""
            echo "Branch: \`main\` | Últimas 50 execuções"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---------|-------|"
            echo "| Total de runs | $TOTAL |"
            echo "| Conclusões terminais | $TERMINAL |"
            echo "| Sucessos reais | $SUCCESSFUL |"
            echo "| Falhas/timeout | $FAILED |"
            echo "| Inconclusivos/cancelados | $INCONCLUSIVE |"
            echo "| Taxa de sucesso terminal | $SUCCESS_RATE |"
            echo "| Taxa de falha terminal | $FAILURE_RATE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert if failure rate > 30%
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const terminal = parseInt('${{ steps.runs.outputs.terminal }}');
            const failed = parseInt('${{ steps.runs.outputs.failed }}');
            const rate = '${{ steps.runs.outputs.failure_rate }}' === 'n/a'
              ? null
              : parseInt('${{ steps.runs.outputs.failure_rate }}');
            if (terminal === 0 || rate === null) {
              console.log('CI inconclusivo: nenhuma execução terminal na amostra.');
              return;
            }
            if (rate < 30) {
              console.log(`CI saudável: ${rate}% de falhas`);
              return;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'ci-health',
            });
            if (issues.length > 0) return; // issue já aberta
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `⚠️ CI instável — taxa de falha ${rate}% nos últimos 50 runs`,
              body:  `Taxa de falha terminal no branch main está em **${rate}%** (${failed}/${terminal} conclusões terminais). Runs cancelados, neutros, ignorados ou pendentes não entram como sucesso.\n\nInvestigue os logs em https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
              labels: ['bug', 'ci-health', 'priority:high'],
            });
