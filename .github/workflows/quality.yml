name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
        continue-on-error: true
      - run: npm run ledger:check
      # O Chromium do Playwright não depende do repositório do Google Chrome.
      # Removê-lo no runner efêmero evita falhas transitórias de hash nesse
      # espelho antes que os testes do projeto possam começar.
      - name: Install Chromium for Playwright
        run: |
          sudo grep -rl 'dl.google.com/linux/chrome-stable' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f || true
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium
      - run: npm run check
      - name: Enforce unit and API coverage thresholds
        run: npm run test:coverage
      - name: Record the performance budget evidence
        id: performance
        env:
          VITE_SITE_SUPABASE_URL: https://xlzmclcjdncjfdrjxclt.supabase.co
          VITE_SITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_playwright_test
          VITE_CUSTOMER_ADJUSTMENTS_ENABLED: 'true'
          VITE_QUOTE_DECISION_GROUPS_ENABLED: 'true'
          VITE_PERSISTENT_SHARED_SELECTIONS_ENABLED: 'true'
          VITE_QUOTE_REQUEST_ENDPOINT: /api/quote-requests
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run build > artifacts/performance-build.log 2>&1
          npm run check:performance-budget 2>&1 | tee artifacts/performance-budget.log
      - name: Reject production sourcemaps
        run: test -z "$(find dist -type f -name '*.map' -print -quit)"
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Quality gate — $(date -u '+%Y-%m-%dT%H:%MZ')"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`  Branch: \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| npm audit | ${{ job.status }} |"
            echo "| npm audit signatures | ${{ job.status }} |"
            echo "| Lint / type-check | ${{ job.status }} |"
            echo "| Unit + API coverage | ${{ job.status }} |"
            echo "| Performance budget | ${{ steps.performance.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage, browser and budget evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
            artifacts/performance-budget.log
            artifacts/performance-build.log
          if-no-files-found: warn
          retention-days: 30

  cross-browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Install Firefox and WebKit for Playwright
        run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:cross-browser
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
