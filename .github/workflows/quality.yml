name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # O scanner de histórico compara a base do pull request ao head.
          # O checkout raso não contém o commit-base e gera scan parcial.
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run ledger:check
      # O Chromium do Playwright não depende do repositório do Google Chrome.
      # Removê-lo no runner efêmero evita falhas transitórias de hash nesse
      # espelho antes que os testes do projeto possam começar.
      - name: Install Chromium for Playwright
        run: |
          sudo grep -rl 'dl.google.com/linux/chrome-stable' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium
      - run: npm run check
      - name: Enforce unit and API coverage thresholds
        run: npm run test:coverage
      - run: npm audit --audit-level=high
      - name: Record the performance budget evidence
        run: |
          mkdir -p artifacts
          npm run check:performance-budget 2>&1 | tee artifacts/performance-budget.log
      - name: Reject production sourcemaps
        run: test -z "$(find dist -type f -name '*.map' -print -quit)"
      - name: Upload coverage, browser and budget evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage/
            playwright-report/
            test-results/
            artifacts/performance-budget.log
          if-no-files-found: warn
          retention-days: 30

  cross-browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Install Firefox and WebKit for Playwright
        run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:cross-browser
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
