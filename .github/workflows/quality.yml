name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.17.0
      - run: npm ci
      # O Chromium do Playwright não depende do repositório do Google Chrome.
      # Removê-lo no runner efêmero evita falhas transitórias de hash nesse
      # espelho antes que os testes do projeto possam começar.
      - name: Install Chromium for Playwright
        run: |
          sudo grep -rl 'dl.google.com/linux/chrome-stable' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Reject production sourcemaps
        run: test -z "$(find dist -type f -name '*.map' -print -quit)"
