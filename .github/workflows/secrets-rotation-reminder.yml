name: Secrets rotation reminder

on:
  schedule:
    # Primeiro dia de cada trimestre às 09:00 UTC: 1 jan, 1 abr, 1 jul, 1 out
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  issues: write

jobs:
  remind:
    name: Create rotation reminder issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open reminder issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const quarter = Math.ceil((new Date().getMonth() + 1) / 3);
            const year    = new Date().getFullYear();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔑 Rotação trimestral de segredos — Q${quarter}/${year}`,
              body: [
                '## Checklist de rotação de segredos',
                '',
                'Revise e rotacione os segredos do repositório conforme necessário:',
                '',
                '- [ ] `VERCEL_TOKEN` — gerar novo token em Vercel → Account Settings → Tokens',
                '- [ ] `SUPABASE_ACCESS_TOKEN` — rotacionar em Supabase → Account → Access Tokens',
                '- [ ] Revisar regras de CODEOWNERS e permissões de colaboradores',
                '- [ ] Verificar dependências com `npm audit`',
                '',
                `_Lembrete gerado automaticamente em ${new Date().toISOString()}_`,
              ].join('\n'),
              labels: ['security', 'maintenance'],
            });
