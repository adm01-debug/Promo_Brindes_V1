name: Production drift detector

on:
  schedule:
    # Diário às 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: production-drift
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Compare Vercel production SHA with main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch production deployment SHA
        id: vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_QyN41X0q8hrqhW80AwokbFLv
          VERCEL_PRODUCTION_DOMAIN: promo-brindes-v1.vercel.app
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN ausente'; exit 1; }
          PROD_META="$(curl -fsSL \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${VERCEL_PRODUCTION_DOMAIN}?teamId=${VERCEL_ORG_ID}")"
          PROD_SHA="$(jq -er '.meta.githubCommitSha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"$PROD_META")" \
            || { echo '::error::Deployment ativo sem githubCommitSha válido'; exit 1; }
          PROD_URL="$(jq -er '.url | select(type == "string" and length > 0)' <<<"$PROD_META")"
          echo "sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: Fetch main HEAD SHA
        id: main
        continue-on-error: true
        run: |
          set -euo pipefail
          MAIN_SHA="$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/main" \
            | jq -er '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))')"
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Check for drift
        id: drift
        if: steps.vercel.outcome == 'success' && steps.main.outcome == 'success'
        run: |
          PROD="${{ steps.vercel.outputs.sha }}"
          MAIN="${{ steps.main.outputs.sha }}"
          if [ "$PROD" = "$MAIN" ]; then
            echo "diverged=false" >> "$GITHUB_OUTPUT"
            echo "Production is up to date: $MAIN"
          else
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED: production=$PROD main=$MAIN"
          fi

      - name: Open or update drift issue
        if: steps.drift.outputs.diverged == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROD_SHA: ${{ steps.vercel.outputs.sha }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          PROD_URL: ${{ steps.vercel.outputs.url }}
        with:
          script: |
            const prod = process.env.PROD_SHA;
            const main = process.env.MAIN_SHA;
            const url = process.env.PROD_URL;
            const title = '🚨 Production drift detected';
            const body = [
              '## Production divergiu de main',
              '',
              `| | SHA |`,
              `|---|---|`,
              `| **main** | \`${main}\` |`,
              `| **production** | \`${prod}\` |`,
              '',
              `Vercel URL de produção: https://${url}`,
              '',
              'Verifique se o VERCEL_TOKEN está válido e execute o workflow de release manualmente para sincronizar.',
              '',
              `_Detectado em: ${new Date().toISOString()}_`,
            ].join('\n');

            const { data: result } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Production drift detected"`,
            });
            const existing = result.items.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Drift ainda presente em ${new Date().toISOString()}\n\nmain: \`${main}\`\nproduction: \`${prod}\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'github_actions'],
              });
            }

      - name: Close recovered detector alerts
        if: steps.vercel.outcome == 'success' && steps.main.outcome == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          DIVERGED: ${{ steps.drift.outputs.diverged }}
        with:
          script: |
            const closeByTitle = async (title, comment) => {
              const { data: result } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              });
              for (const issue of result.items.filter((item) => item.title === title)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: comment,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            };
            const now = new Date().toISOString();
            await closeByTitle('🚨 Production drift detector failed', `Detector voltou a operar normalmente em ${now}.`);
            if (process.env.DIVERGED === 'false') {
              await closeByTitle('🚨 Production drift detected', `Produção e main voltaram a ficar sincronizadas em ${now}.`);
            }

      - name: Open or update detector failure issue
        if: steps.vercel.outcome == 'failure' || steps.main.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          VERCEL_OUTCOME: ${{ steps.vercel.outcome }}
          MAIN_OUTCOME: ${{ steps.main.outcome }}
        with:
          script: |
            const title = '🚨 Production drift detector failed';
            const now = new Date().toISOString();
            const body = [
              '## O detector não conseguiu concluir a comparação',
              '',
              `- consulta Vercel: **${process.env.VERCEL_OUTCOME}**`,
              `- consulta main: **${process.env.MAIN_OUTCOME}**`,
              '',
              'Enquanto este alerta estiver aberto, o estado de sincronização é desconhecido.',
              '',
              `_Detectado em: ${now}_`,
            ].join('\n');
            const { data: result } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Production drift detector failed"`,
            });
            const existing = result.items.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail closed when the detector is incomplete
        if: steps.vercel.outcome == 'failure' || steps.main.outcome == 'failure'
        run: |
          echo '::error::Não foi possível comparar produção e main; alerta operacional criado.'
          exit 1

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Production drift — $(date -u '+%Y-%m-%dT%H:%MZ')"
            echo ""
            echo "| | SHA |"
            echo "|---|---|"
            echo "| main | \`${{ steps.main.outputs.sha }}\` |"
            echo "| production | \`${{ steps.vercel.outputs.sha }}\` |"
            echo ""
            case "${{ steps.drift.outputs.diverged }}" in
              true) echo "**Status: DRIFT DETECTADO** ⚠️" ;;
              false) echo "**Status: Em sincronia** ✅" ;;
              *) echo "**Status: verificação incompleta** ❌" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
